version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - node -v
        - npm -v
        - git lfs install
        - git lfs pull
        - rm -rf build
        - npm install
    build:
      commands:
        - npm run build
        - mkdir -p build/assets/dt/tomasko_1.0
        - cp -r public/assets/dt/tomasko_1.0/* build/assets/dt/tomasko_1.0/
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*